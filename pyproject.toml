[project]
name = "twin-credit-experiment"
version = "0.1.0"
description = "Which multi-agent RL credit schemes push language models toward causal versus evidential or functional decision theory."
readme = "README.md"
requires-python = ">=3.13"
license = "CC-BY-SA-4.0"
license-files = ["LICENSE"]
authors = [{ name = "a9lim", email = "mx@a9l.im" }]
dependencies = [
    "numpy",
    "requests",
]

[project.optional-dependencies]
figures = ["matplotlib"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["twin_credit_experiment"]

[tool.pytest.ini_options]
testpaths = ["tests"]
